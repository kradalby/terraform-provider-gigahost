name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The nix check gates run in a hermetic sandbox, so they cover only what needs
# no network: formatting. The shim's own compile needs to fetch gigahost-go, so
# it runs outside the sandbox in its own job — that is the one thing worth
# proving here, because everything else in this repository is generated.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      - name: formatting
        run: nix build -L .#checks.x86_64-linux.formatting

  build:
    name: shim compiles against the pinned gigahost-go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      # The whole point of this repository is that it builds. If the pinned
      # gigahost-go commit no longer satisfies the shim, the release is what
      # would otherwise discover it.
      - name: go build
        run: nix develop --command -- go build ./...

      - name: go vet
        run: nix develop --command -- go vet ./...

  docs:
    name: docs match the pinned provider schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      # examples/ is generated and lands on the first release, so tolerate its
      # absence; once present it must stay formatted, because these files are
      # what the registry renders as Example Usage.
      - name: tofu fmt
        run: |
          nix develop --command -- bash -c '
            if [ -d examples ]; then
              tofu fmt -check -recursive examples
            else
              echo "examples/ not present yet; it lands with the first bump"
            fi'
